name: Publish feed

on:
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC — regulators publish during EU business hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

      # The CLI exits 1 when a source failed or ids collided. A degraded run
      # still produces a usable feed for everything that did work, so publish it
      # and fail the job at the end instead of losing the day's data entirely.
      - name: Fetch and archive
        id: fetch
        run: |
          set +e
          node dist/cli.js fetch --pretty --archive > feed/latest.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Derived views of the same run. `export` reads the JSON just written, so
      # this costs no extra requests to the regulators.
      - name: Render the calendar and Atom views
        run: |
          if [ -s feed/latest.json ]; then
            node dist/cli.js export --from feed/latest.json --format ics > feed/latest.ics
            node dist/cli.js export --from feed/latest.json --format atom > feed/latest.atom
          else
            echo "::warning::feed/latest.json is empty; skipping the ics and atom views"
          fi

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- feed/latest.json
          if [ -f feed/latest.ics ]; then
            git add -- feed/latest.ics feed/latest.atom
          fi
          if [ -d archive ]; then
            git add -- archive
          fi
          # Skip the commit when nothing but run timestamps changed
          # git -I matches the line content, without the +/- prefix.
          if git diff --cached \
               -I'"(generated_at|fetched_at|updated_at|retrieved_at)"' \
               -I'^(DTSTAMP|LAST-MODIFIED):' \
               -I'^  <updated>' --quiet; then
            echo "No new events — skipping commit"
          else
            git commit -m "feed: daily update $(date -u +%F)"
            git push
          fi

      - name: Fail if the run was degraded
        if: steps.fetch.outputs.status != '0'
        run: |
          echo "::error::fetch exited ${{ steps.fetch.outputs.status }} — a source failed or ids collided; see the fetch step log"
          exit 1
